<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Logg inn — Frantz kampanjeportal</title>
<link rel="stylesheet" href="../frantz-ds.css?v=98">
<link rel="stylesheet" href="../styles/portal-login.css?v=1">
</head>
<body>

<div class="login">
  <div class="card card--betjen login__card">
    <img class="login__logo" src="../assets/logo-frantz.png" alt="Frantz">
    <h1>Logg inn på kampanjeportalen</h1>
    <p class="login__lede">For Nordlys Rekruttering AS. Bruk kontoen rådgiveren din har satt opp.</p>

    <form onsubmit="event.preventDefault(); location.href='dashboard.html';">
      <div class="form-group">
        <label class="form-label" for="epost">E-post</label>
        <input class="form-input" type="email" id="epost" name="epost" placeholder="navn@nordlysrekruttering.no" value="kari.hansen@nordlysrekruttering.no" autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="passord">Passord</label>
        <input class="form-input" type="password" id="passord" name="passord" placeholder="••••••••" autocomplete="current-password">
      </div>

      <div class="login__row">
        <label class="form-check">
          <input class="form-check__input" type="checkbox" checked>
          <span class="form-check__box"></span>
          <span class="form-check__label">Husk meg</span>
        </label>
        <a href="glemt-passord.html">Glemt passord?</a>
      </div>

      <button class="btn btn--primary" type="submit">Logg inn</button>
    </form>

    <p class="login__footer">Har du ikke tilgang? Kontakt rådgiveren din i Frantz.<br>Ny hos Frantz? Kontakt oss, så setter vi opp en konto.</p>
    <!-- [GAP] Link "Kontakt oss" to Frantz' real contact page or e-mail when it is confirmed. -->
  </div>
</div>

</body>
</html>
